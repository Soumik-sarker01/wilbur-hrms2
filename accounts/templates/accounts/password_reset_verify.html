<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Verify Password Reset Code</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <style>
    .container { margin-top: 40px; }
  </style>
</head>
<body>
<div class="container">
  <h2>Verify Code</h2>
  <p>Enter your username and the verification code sent to your email.</p>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Verify</button>
  </form>
  <p><a href="{% url 'password_reset_request' %}">Request a new code</a></p>
</div>
</body>
</html>
