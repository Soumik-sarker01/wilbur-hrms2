{% if login_form.non_field_errors %}
  <div class="alert alert-danger" role="alert">
    {{ login_form.non_field_errors|striptags }}
  </div>
{% endif %}
<div class="form-group">
  <input type="text" name="username" placeholder="Username" required>
  {% if login_form.username.errors %}
    <span class="error-message">{{ login_form.username.errors|striptags }}</span>
  {% endif %}
</div>
<div class="form-group">
  <input type="password" name="password" placeholder="Password" required>
  {% if login_form.password.errors %}
    <span class="error-message">{{ login_form.password.errors|striptags }}</span>
  {% endif %}
</div>
<button type="submit" class="submit">Sign In</button>
<div style="margin-top: 10px; text-align: center;">
  <a href="{% url 'password_reset_request' %}">Forgot Password?</a>
</div>
