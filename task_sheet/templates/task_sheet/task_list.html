<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daily Work Assignments (Monthly Pivot Summary)</title>
  <!-- Bootstrap CSS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" />
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background-color: #f8f9fa;
      text-align: center;
    }
    .update-btn {
      margin-top: 20px;
      background-color: #007bff;
      color: #fff;
      border: none;
      padding: 10px 20px;
      border-radius: 4px;
      cursor: pointer;
    }
    .update-btn:hover {
      background-color: #0056b3;
    }
    .freeze-left-col {
      position: sticky;
      left: 0;
      background: #fff;
      z-index: 1;
    }
    .current-date-col {
      background-color: #d1ecf1;
    }
    .pivot-summary-container {
      overflow-x: auto;
      margin-bottom: 20px;
    }
    /* Header and summary table font sizes */
    .table thead th {
      font-size: 14px;
      text-align: center;
      vertical-align: middle;
    }
    .pivot-summary-container .table td,
    .pivot-summary-container .table th {
      font-size: 14px;
    }
    /* Main table data cells */
    .main-table tbody td {
      font-size: 12px;
      vertical-align: middle;
    }
    /* Remove spinner arrows for number inputs */
    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    input[type=number] {
      -moz-appearance: textfield;
    }
    /* Expandable input fields */
    input.expandable {
      width: 80px;
      transition: width 0.3s ease;
    }
    input.expandable:focus {
      width: 150px;
    }
    /* Date cell: larger font, bold and vertically centered */
    .date-cell {
      font-size: 24px;
      font-weight: bold;
      vertical-align: middle;
    }
    /* Remove dropdown arrow icons and extra right padding */
    select.form-select {
      -webkit-appearance: none;
      -moz-appearance: none;
      appearance: none;
      background: none !important;
      background-image: none !important;
      padding-right: 0 !important;
    }
    select.form-select::-ms-expand {
      display: none;
    }
    /* Global style: smaller placeholder fonts */
    input::placeholder {
      font-size: 10px;
    }
    /* Use a Bootstrap button group for horizontal add/delete buttons */
    .btn-group > button {
      /* Additional styling if needed */
    }
    /* Style for the undo alert */
    #undo-alert {
      display: none;
      position: fixed;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      background: #ffc;
      border: 1px solid #cc0;
      padding: 10px;
      z-index: 1000;
    }
    /* Progress bar container styling */
    .progress {
      height: 25px;
      position: relative;
      margin-bottom: 0;
    }
    .progress-bar {
      line-height: 25px;
      text-align: center;
      color: black;
    }
    .progress-input {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
      text-align: center;
      background: transparent;
      padding: 0;
      margin: 0;
      line-height: 25px;
      color: black;
    }
    /* Let the container wrap without horizontal scrolling */
    .table-container {
      overflow-x: visible;
    }
  </style>
</head>
<body>

  <!-- Undo Alert -->
  <div id="undo-alert">
    <span id="undo-message"></span>
    <button id="undo-button" class="btn btn-sm btn-primary">Undo</button>
  </div>

  <!-- TOP-RIGHT: Pivoted Summary Table -->

  <div class="table-container">
    <h3>Daily Work Assignments</h3>
    <!-- Updated table with multi-level header for designer subcolumns -->
    <table class="table table-sm table-bordered table-hover text-center main-table" style="width:100%;">
      <colgroup>
        <!-- Non-designer columns -->
        <col style="width:4%"><!-- Date -->
        <col style="width:5%"><!-- Order ID -->
        <col style="width:3%"><!-- Profile -->
        <col style="width:5%"><!-- Client -->
        <col style="width:4%"><!-- Total Design -->
        <col style="width:4%"><!-- Previously Done -->
        <col style="width:3%"><!-- Today Target -->
        <col style="width:4%"><!-- Status -->
        <col style="width:5%"><!-- Remarks -->

        <col style="width:4%"><!-- Desi-1 Target -->
        <col style="width:4%"><!-- Desi-1 Done -->
        <col style="width:4%"><!-- Desi-2 Name -->

        <col style="width:4%"><!-- Desi-4 Target -->

        <col style="width:3%"><!-- Design Left -->

        <tr>
          <th rowspan="2">Date</th>
          <th rowspan="2">ID</th>
          <th rowspan="2">Profile</th>
          <th rowspan="2">Client</th>
          <th rowspan="2">Total Design</th>
          <th rowspan="2">Previously Done</th>
          <th rowspan="2">Today Target</th>
          <th rowspan="2">Status</th>
          <th rowspan="2">Remarks</th>
          <th rowspan="2">Due</th>
          <th colspan="3">Desi-1</th>
          <th colspan="3">Desi-2</th>
          <th colspan="3">Desi-3</th>
          <th colspan="3">Desi-4</th>
          <th rowspan="2">Done Today</th>
          <th rowspan="2">Design Left</th>
          <th rowspan="2">Total Done</th>
          <th rowspan="2">Actions</th>
        </tr>
        <tr>
          <th>Name</th>
          <th>Target</th>
          <th>Done</th>
          <th>Name</th>
          <th>Target</th>
          <th>Done</th>
          <th>Name</th>
          <th>Target</th>
          <th>Done</th>
          <th>Name</th>
          <th>Target</th>
          <th>Done</th>
        </tr>
      </thead>
      <tbody id="task-table-body">
        <tr>
          <!-- Main row (includes date cell with rowspan) -->
          <!-- 0: Date -->
          <td rowspan="1" class="date-cell" id="dateCell"></td>
          <!-- 1: Order ID -->
          <td>
            <input type="text" class="form-control form-control-sm expandable" placeholder="Order ID">
          </td>
          <!-- 2: Profile -->

          <!-- 3: Client -->

          </td>
          <!-- 4: Total Design -->
          <td>
            <input type="number" class="form-control form-control-sm expandable" placeholder="Total Need">
          </td>
          <!-- 5: Previously Done (with progress bar) -->
          <td>

          <!-- Designer columns for Main row -->

          <td>
            <select class="form-select form-select-sm">

          <!-- Desi-2 -->

              <option>Upal</option>
              <option>Shethil</option>
              <option>Marjanul</option>

          </td>
          <td>
            <input type="number" class="form-control form-control-sm" placeholder="Done">

            </select>
          </td>
          <td>

          </td>
          <td>
            <input type="number" class="form-control form-control-sm" placeholder="Done">
          </td>
          <!-- Desi-4 -->
          <td>
            <select class="form-select form-select-sm">

              <option>Shethil</option>
              <option>Marjanul</option>

          </td>

          </td>
          <td>
            <div class="btn-group" role="group" aria-label="Row Actions">

        </tr>
      </tbody>
    </table>
  </div>

  <!-- Update Button -->
  <button class="update-btn" onclick="updateData()">Update</button>

  <!-- Modal for Remarks -->
  <div class="modal fade" id="remarksModal" tabindex="-1" aria-labelledby="remarksModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-sm">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="remarksModalLabel">Add/Edit Remarks</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <textarea id="remarksTextArea" class="form-control" rows="3"></textarea>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
          <button type="button" class="btn btn-primary" onclick="saveRemarks()">Save</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS + Popper -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
  <script>
    // Utility: Interpolate color from red (0%) to green (100%)
    function getInterpolatedColor(percentage) {
      let r = Math.round(255 * (100 - percentage) / 100);
      let g = Math.round(255 * percentage / 100);
      return "rgb(" + r + "," + g + ",0)";
    }

    // Global variables for default row deletion undo
    let pendingDefaultDeletion = null;
    let defaultDeletionTimer = null;
    let defaultDeletionCountdown = 3;

    // Check if a row is a main row (has a date cell)
    function isMainRow(row) {
      return row.querySelector(".date-cell") !== null;
    }

    // Known designers for pivot summary
    const KNOWN_DESIGNERS = ["Upal", "Shethil", "Marjanul", "Fahad", "Sojol"];
    let MARCH_DATES = [];
    let CURRENT_DATE_STR = "";
    let CURRENT_MONTH_LABEL = "";

    window.onload = function () {
      const dateCell = document.getElementById("dateCell");
      let today = new Date();
      let startDate, endDate;
      if (today.getDate() >= 26) {
        let nextMonth = new Date(today.getFullYear(), today.getMonth() + 1, 1);
        CURRENT_MONTH_LABEL = nextMonth.toLocaleString("default", { month: "long" });
        startDate = new Date(today.getFullYear(), today.getMonth(), 26);
        endDate = new Date(today.getFullYear(), today.getMonth() + 1, 25);
      } else {
        CURRENT_MONTH_LABEL = today.toLocaleString("default", { month: "long" });
        startDate = new Date(today.getFullYear(), today.getMonth() - 1, 26);
        endDate = new Date(today.getFullYear(), today.getMonth(), 25);
      }
      MARCH_DATES = [];
      let current = new Date(startDate);
      while (current <= endDate) {
        let day = current.getDate();
        let month = current.toLocaleString("default", { month: "short" });
        MARCH_DATES.push(day + "-" + month);
        current.setDate(current.getDate() + 1);
      }
      if (dateCell) {
        CURRENT_DATE_STR = getFormattedDate();
        dateCell.innerText = CURRENT_DATE_STR;
      }
      document.querySelector("h4").innerText = "Monthly Pivot Summary (" + CURRENT_MONTH_LABEL + ")";
      attachEventListeners();
      buildPivotHeader();
      updateDesignerSummary();
    };

    function getFormattedDate() {
      const today = new Date();
      const month = today.toLocaleString("default", { month: "short" });
      const day = today.getDate();
      return day + "-" + month;
    }

    function attachEventListeners() {
      const tableBody = document.getElementById("task-table-body");
      const relevantFields = tableBody.querySelectorAll("select, input");
      relevantFields.forEach(field => {
        field.removeEventListener("input", handleFieldInput);
        field.addEventListener("input", handleFieldInput);
        field.removeEventListener("change", handleFieldInput);
        field.addEventListener("change", handleFieldInput);
      });
    }

    // Update all rows for recalculation
    function updateAllRows() {
      const rows = document.querySelectorAll("#task-table-body tr");
      rows.forEach(row => {
        updateCalculatedColumns(row);
      });
    }

    function handleFieldInput(e) {
      updateAllRows();
      updateDesignerSummary();
    }

    let currentRemarksInput = null;
    function openRemarksModal(inputElement) {
      currentRemarksInput = inputElement;
      document.getElementById("remarksTextArea").value = inputElement.value || "";
      const modal = new bootstrap.Modal(document.getElementById("remarksModal"), {});
      modal.show();
    }
    function saveRemarks() {
      const newText = document.getElementById("remarksTextArea").value;
      if (currentRemarksInput) {
        currentRemarksInput.value = newText;
      }
      const modalElement = document.getElementById("remarksModal");
      const modal = bootstrap.Modal.getInstance(modalElement);
      modal.hide();
    }

    // Delete row with undo for main row; adjust indices for sub rows accordingly
    function deleteRow(button) {
      const row = button.closest("tr");
      const tableBody = row.parentNode;
      if (tableBody.querySelectorAll("tr").length === 1) {
        alert("Cannot delete the only row.");
        return;
      }
      if (isMainRow(row)) {
        confirmDefaultRowDeletion(row);
        return;
      }
      
      // For sub rows, use Order ID matching to adjust previous done values if needed.
      let orderId = row.cells[0].querySelector("input").value.trim();
      if (orderId !== "") {
        let group = [];
        const allRows = document.querySelectorAll("#task-table-body tr");
        allRows.forEach(r => {
          let rOrderId = "";
          if (isMainRow(r)) {
            rOrderId = r.cells[1].querySelector("input").value.trim();
          } else {
            rOrderId = r.cells[0].querySelector("input").value.trim();
          }
          if (rOrderId === orderId) {
            group.push(r);
          }
        });
        const index = group.indexOf(row);
        if (index > 0 && index < group.length - 1) {
          const prevRow = group[index - 1];
          const nextRow = group[index + 1];
          let prevTotalDone = "";
          if (isMainRow(prevRow)) {
            prevTotalDone = prevRow.cells[24].querySelector("input").value;
          } else {
            prevTotalDone = prevRow.cells[23].querySelector("input").value;
          }
          row.remove();
          if (isMainRow(nextRow)) {
            nextRow.cells[5].querySelector("input.progress-input").value = prevTotalDone;
          } else {
            nextRow.cells[4].querySelector("input.progress-input").value = prevTotalDone;
          }
          updateCalculatedColumns(nextRow);
          updateDesignerSummary();
          return;
        }
      }
      
      const dateCell = tableBody.querySelector("tr:first-child .date-cell");
      if (dateCell) {
        let rowSpan = parseInt(dateCell.getAttribute("rowspan") || "1");
        dateCell.setAttribute("rowspan", rowSpan - 1);
      }
      row.remove();
      attachEventListeners();
      updateDesignerSummary();
    }

    function confirmDefaultRowDeletion(row) {
      pendingDefaultDeletion = row.cloneNode(true);
      const undoAlert = document.getElementById("undo-alert");
      const undoMessage = document.getElementById("undo-message");
      defaultDeletionCountdown = 3;
      undoMessage.textContent = "Default row will be deleted in " + defaultDeletionCountdown + " seconds.";
      undoAlert.style.display = "block";
      
      defaultDeletionTimer = setInterval(function() {
        defaultDeletionCountdown--;
        if(defaultDeletionCountdown > 0) {
          undoMessage.textContent = "Default row will be deleted in " + defaultDeletionCountdown + " seconds.";
        } else {
          clearInterval(defaultDeletionTimer);
          undoAlert.style.display = "none";
          const tableBody = row.parentNode;
          const dateValue = row.cells[0].innerText;
          row.remove();
          const newFirstRow = tableBody.querySelector("tr");
          if (newFirstRow) {
            const newDateCell = document.createElement("td");
            newDateCell.innerText = dateValue;
            newDateCell.classList.add("date-cell");
            newDateCell.id = "dateCell";
            newFirstRow.insertAdjacentElement('afterbegin', newDateCell);
            const numRows = tableBody.querySelectorAll("tr").length;
            newDateCell.setAttribute("rowspan", numRows);
          }
          attachEventListeners();
          updateDesignerSummary();
        }
      }, 1000);
    }

    document.getElementById("undo-button").addEventListener("click", function() {
      clearInterval(defaultDeletionTimer);
      document.getElementById("undo-alert").style.display = "none";
      if (pendingDefaultDeletion) {
        const tableBody = document.getElementById("task-table-body");
        const currentFirstRow = tableBody.querySelector("tr");
        if (currentFirstRow && currentFirstRow.querySelector(".date-cell")) {
          currentFirstRow.removeChild(currentFirstRow.querySelector(".date-cell"));
        }
        tableBody.insertBefore(pendingDefaultDeletion, tableBody.firstChild);
      }
      pendingDefaultDeletion = null;
      attachEventListeners();
      updateDesignerSummary();
    });

    function addRow(button) {
      const currentRow = button.closest("tr");
      const tableBody = currentRow.parentNode;
      const dateCell = tableBody.querySelector("tr:first-child .date-cell");
      if (dateCell) {
        let rowSpan = parseInt(dateCell.getAttribute("rowspan") || "1");
        dateCell.setAttribute("rowspan", rowSpan + 1);
      }
      const newRow = document.createElement("tr");
      newRow.innerHTML = getSubRowHTML();
      tableBody.insertBefore(newRow, currentRow.nextSibling);
      attachEventListeners();
      updateDesignerSummary();
    }

    // Sub row: note that sub rows do not include a date cell.
    function getSubRowHTML() {
      return `
        <!-- Sub row structure (no date cell) -->
        <td>
          <input type="text" class="form-control form-control-sm expandable" placeholder="Order ID">
        </td>
        <td>
          <select class="form-select form-select-sm">
            <option value="1">1</option>
            <option value="2">2</option>
          </select>
        </td>
        <td>
          <input type="text" class="form-control form-control-sm expandable" placeholder="Client Name">
        </td>
        <td>
          <input type="number" class="form-control form-control-sm expandable" placeholder="Total Need">
        </td>
        <td>
          <div class="progress">
            <div 
              class="progress-bar" 
              role="progressbar" 
              style="width: 0%; background-color: red; color: black;" 
              aria-valuenow="0" 
              aria-valuemin="0" 
              aria-valuemax="100">
            </div>
            <input 
              type="number" 
              class="progress-input form-control form-control-sm"
              placeholder="Previously Done"
              onblur="updateAllRows();">
          </div>
        </td>
        <td>
          <input type="number" class="form-control form-control-sm expandable" placeholder="Today Target">
        </td>
        <td>
          <select class="form-select form-select-sm">
            <option value="In Process">In Process</option>
            <option value="Revision">Revision</option>
            <option value="Content">Content</option>
          </select>
        </td>
        <td>
          <input type="text" class="form-control form-control-sm" placeholder="Click to add remarks..." readonly onclick="openRemarksModal(this)">
        </td>
        <td>
          <input type="date" class="form-control form-control-sm">
        </td>
        <!-- Designer columns for sub row -->
        <!-- Desi-1 -->
        <td>
          <select class="form-select form-select-sm">
            <option>Upal</option>
            <option>Shethil</option>
            <option>Marjanul</option>
            <option>Fahad</option>
            <option>Sojol</option>
          </select>
        </td>
        <td>
          <input type="number" class="form-control form-control-sm" placeholder="Target">
        </td>
        <td>
          <input type="number" class="form-control form-control-sm" placeholder="Done">
        </td>
        <!-- Desi-2 -->
        <td>
          <select class="form-select form-select-sm">
            <option>Upal</option>
            <option>Shethil</option>
            <option>Marjanul</option>
            <option>Fahad</option>
            <option>Sojol</option>
          </select>
        </td>
        <td>
          <input type="number" class="form-control form-control-sm" placeholder="Target">
        </td>
        <td>
          <input type="number" class="form-control form-control-sm" placeholder="Done">
        </td>
        <!-- Desi-3 -->
        <td>
          <select class="form-select form-select-sm">
            <option>Upal</option>
            <option>Shethil</option>
            <option>Marjanul</option>
            <option>Fahad</option>
            <option>Sojol</option>
          </select>
        </td>
        <td>
          <input type="number" class="form-control form-control-sm" placeholder="Target">
        </td>
        <td>
          <input type="number" class="form-control form-control-sm" placeholder="Done">
        </td>
        <!-- Desi-4 -->
        <td>
          <select class="form-select form-select-sm">
            <option>Upal</option>
            <option>Shethil</option>
            <option>Marjanul</option>
            <option>Fahad</option>
            <option>Sojol</option>
          </select>
        </td>
        <td>
          <input type="number" class="form-control form-control-sm" placeholder="Target">
        </td>
        <td>
          <input type="number" class="form-control form-control-sm" placeholder="Done">
        </td>
        <!-- Final calculated columns for sub row -->
        <td>
          <input type="number" class="form-control form-control-sm" placeholder="Done Today" readonly>
        </td>
        <td>
          <input type="number" class="form-control form-control-sm" placeholder="Design Left" readonly>
        </td>
        <td>
          <input type="number" class="form-control form-control-sm" placeholder="Total Done" readonly>
        </td>
        <td>
          <div class="btn-group" role="group" aria-label="Row Actions">
            <button class="add-row-btn" onclick="addRow(this)">+</button>
            <button class="delete-row-btn" onclick="deleteRow(this)">-</button>
          </div>
        </td>
      `;
    }

    // -------------------------------
    // CALCULATED COLUMNS
    // -------------------------------
    function updateCalculatedColumns(row) {
      // For main rows offset = 0; for sub rows offset = -1
      const offset = isMainRow(row) ? 0 : -1;
      const cells = row.cells;

      // For a main row with stored data, restore key values if needed.
      if (isMainRow(row) && row.dataset.defaultData) {
        let stored = JSON.parse(row.dataset.defaultData);
        let orderIdInput = cells[1].querySelector("input");
        if (!orderIdInput.value.trim() && stored["1"]) {
          orderIdInput.value = stored["1"];
        }
        let clientNameInput = cells[3].querySelector("input");
        if (!clientNameInput.value.trim() && stored["3"]) {
          clientNameInput.value = stored["3"];
        }
        let totalNeedInput = cells[4].querySelector("input");
        if (!totalNeedInput.value.trim() && stored["4"]) {
          totalNeedInput.value = stored["4"];
        }
      }

      const orderId = cells[1 + offset].querySelector("input").value.trim();
      const totalNeedInput = cells[4 + offset].querySelector("input");
      let totalNeed = parseInt(totalNeedInput.value) || 0;

      // Copy total design need and client name from first row in same order group if needed.
      if (orderId !== "") {
        let sameOrderRows = [];
        const allRows = document.querySelectorAll("#task-table-body tr");
        allRows.forEach(r => {
          let rOffset = isMainRow(r) ? 0 : -1;
          let rOrderId = r.cells[1 + rOffset].querySelector("input").value.trim();
          if (rOrderId === orderId) sameOrderRows.push(r);
        });
        if (sameOrderRows.length > 0) {
          const firstRow = sameOrderRows[0];
          let firstRowOffset = isMainRow(firstRow) ? 0 : -1;
          const firstTotalNeed = firstRow.cells[4 + firstRowOffset].querySelector("input").value;
          const currentIndex = sameOrderRows.indexOf(row);
          if (currentIndex > 0) {
            totalNeedInput.value = firstTotalNeed;
            totalNeed = parseInt(firstTotalNeed) || 0;
          }
        }
      }

      const clientNameInput = cells[3 + offset].querySelector("input");
      let clientName = clientNameInput.value;
      if (orderId !== "") {
        let sameOrderRows = [];
        const allRows = document.querySelectorAll("#task-table-body tr");
        allRows.forEach(r => {
          let rOffset = isMainRow(r) ? 0 : -1;
          let rOrderId = r.cells[1 + rOffset].querySelector("input").value.trim();
          if (rOrderId === orderId) sameOrderRows.push(r);
        });
        if (sameOrderRows.length > 0) {
          const firstRow = sameOrderRows[0];
          let firstRowOffset = isMainRow(firstRow) ? 0 : -1;
          const firstClientName = firstRow.cells[3 + firstRowOffset].querySelector("input").value;
          const currentIndex = sameOrderRows.indexOf(row);
          if (currentIndex > 0) {
            clientNameInput.value = firstClientName;
            clientName = firstClientName;
          }
        }
      }

      // For Previously Done: copy from row immediately above if same order.
      const prevDoneCell = cells[5 + offset];
      const prevDoneInput = prevDoneCell.querySelector("input.progress-input");
      let prevDone = parseInt(prevDoneInput.value) || 0;
      if (orderId !== "") {
        let sameOrderRows = [];
        const allRows = document.querySelectorAll("#task-table-body tr");
        allRows.forEach(r => {
          let rOffset = isMainRow(r) ? 0 : -1;
          let rOrderId = r.cells[1 + rOffset].querySelector("input").value.trim();
          if (rOrderId === orderId) sameOrderRows.push(r);
        });
        const currentIndex = sameOrderRows.indexOf(row);
        if (currentIndex > 0) {
          const nearestRow = sameOrderRows[currentIndex - 1];
          let nearestOffset = isMainRow(nearestRow) ? 0 : -1;
          const nearestTotalDoneValue = nearestRow.cells[(isMainRow(nearestRow) ? 24 : 23)].querySelector("input").value;
          prevDoneInput.value = nearestTotalDoneValue;
          prevDone = parseInt(nearestTotalDoneValue) || 0;
          prevDoneInput.readOnly = true;
        } else {
          prevDoneInput.readOnly = false;
        }
      }

      // Update progress bar based on ratio.
      const progressBar = prevDoneCell.querySelector(".progress-bar");
      let percentage = totalNeed > 0 ? Math.min((prevDone / totalNeed) * 100, 100) : 0;
      progressBar.style.width = percentage + "%";
      progressBar.setAttribute("aria-valuenow", prevDone);
      progressBar.style.backgroundColor = getInterpolatedColor(percentage);

      // Calculate Done Today as the sum of all designer "Done" inputs.
      let doneSum = 0;
      for (let i = 0; i < 4; i++) {
        // For main row, designer i "Done" is at: 10 + i*3 + 2; for sub row it shifts by -1.
        let idx = 10 + i * 3 + 2 + offset;
        let cell = cells[idx];
        let value = parseInt(cell.querySelector("input").value) || 0;
        doneSum += value;
      }
      // Correction: "Done Today" is now just the sum of designer Done values.
      const doneToday = doneSum;
      const totalDone = prevDone + doneToday;
      const designLeft = totalNeed - totalDone;

      // Set calculated fields (final columns differ by row type).
      let doneTodayIdx = isMainRow(row) ? 22 : 21;
      let designLeftIdx = isMainRow(row) ? 23 : 22;
      let totalDoneIdx = isMainRow(row) ? 24 : 23;
      cells[doneTodayIdx].querySelector("input").value = doneToday;
      cells[designLeftIdx].querySelector("input").value = designLeft;
      cells[totalDoneIdx].querySelector("input").value = totalDone;
    }

    // -------------------------------
    // PIVOT (Aggregation) LOGIC
    // -------------------------------
    function updateDesignerSummary() {
      const aggregator = {};
      const allRows = document.querySelectorAll("#task-table-body tr");
      allRows.forEach(row => {
        const offset = isMainRow(row) ? 0 : -1;
        const dateVal = isMainRow(row)
          ? row.cells[0].innerText.trim()
          : document.getElementById("dateCell").innerText.trim();
        if (!dateVal) return;
        // For each designer group (4 groups)
        for (let i = 0; i < 4; i++) {
          // For main row, group i:
          // Name cell index = 10 + i*3; Target = +1; Done = +2.
          let baseIdx = 10 + i * 3 + offset;
          let designerCell = row.cells[baseIdx];
          if (!designerCell) continue;
          let sel = designerCell.querySelector("select");
          let targCell = row.cells[baseIdx + 1];
          let doneCell = row.cells[baseIdx + 2];
          if (!sel) continue;
          let designerName = sel.value;
          let targetVal = parseInt(targCell.querySelector("input").value) || 0;
          let doneVal = parseInt(doneCell.querySelector("input").value) || 0;
          addToAggregator(aggregator, dateVal, designerName, targetVal, doneVal);
        }
      });
      buildPivotHeader();
      buildPivotedTable(aggregator);
    }

    function addToAggregator(aggregator, dateVal, designerName, targVal, doneVal) {
      if (!designerName) return;
      if (!aggregator[dateVal]) aggregator[dateVal] = {};
      if (!aggregator[dateVal][designerName]) {
        aggregator[dateVal][designerName] = { target: 0, done: 0 };
      }
      aggregator[dateVal][designerName].target += targVal;
      aggregator[dateVal][designerName].done += doneVal;
    }

    function buildPivotHeader() {
      const thead = document.getElementById("designerSummaryThead");
      thead.innerHTML = "";
      const row1 = document.createElement("tr");
      const row2 = document.createElement("tr");
      const thDesigner = document.createElement("th");
      thDesigner.rowSpan = 2;
      thDesigner.innerText = "Designer";
      thDesigner.classList.add("freeze-left-col");
      row1.appendChild(thDesigner);
      MARCH_DATES.forEach(dateStr => {
        const thDate = document.createElement("th");
        thDate.colSpan = 2;
        thDate.innerText = dateStr;
        thDate.classList.add("summary-date-header");
        row1.appendChild(thDate);
        const thTarget = document.createElement("th");
        thTarget.innerText = "Target";
        thTarget.classList.add("summary-sub-header");
        const thDone = document.createElement("th");
        thDone.innerText = "Done";
        thDone.classList.add("summary-sub-header");
        row2.appendChild(thTarget);
        row2.appendChild(thDone);
      });
      thead.appendChild(row1);
      thead.appendChild(row2);
    }

    function buildPivotedTable(aggregator) {
      const tbody = document.getElementById("designerSummaryTbody");
      tbody.innerHTML = "";
      KNOWN_DESIGNERS.forEach(designer => {
        const row = document.createElement("tr");
        const designerCell = document.createElement("td");
        designerCell.innerText = designer;
        designerCell.classList.add("freeze-left-col");
        row.appendChild(designerCell);
        MARCH_DATES.forEach(dateStr => {
          let data = (aggregator[dateStr] && aggregator[dateStr][designer]) || { target: 0, done: 0 };
          const tdTarget = document.createElement("td");
          tdTarget.innerText = data.target;
          if (dateStr === CURRENT_DATE_STR) tdTarget.classList.add("current-date-col");
          const tdDone = document.createElement("td");
          tdDone.innerText = data.done;
          if (dateStr === CURRENT_DATE_STR) tdDone.classList.add("current-date-col");
          row.appendChild(tdTarget);
          row.appendChild(tdDone);
        });
        tbody.appendChild(row);
      });
    }

    // Collect all rows and send to backend.
    function updateData() {
      const tasks = [];
      const rows = document.querySelectorAll("#task-table-body tr");
      rows.forEach((row, index) => {
        if (isMainRow(row)) {
          tasks.push({
            order_id: row.cells[1].querySelector("input").value.trim() || ("NEW-" + index),
            date: row.cells[0].innerText.trim() ? new Date(row.cells[0].innerText.trim()).toISOString().split("T")[0] : "",
            profile: row.cells[2].querySelector("select").value,
            client_name: row.cells[3].querySelector("input").value,
            total_needed: parseInt(row.cells[4].querySelector("input").value) || 0,
            previously_done: parseInt(row.cells[5].querySelector("input.progress-input").value) || 0,
            today_target: parseInt(row.cells[6].querySelector("input").value) || 0,
            project_status: row.cells[7].querySelector("select").value,
            remarks: row.cells[8].querySelector("input").value,
            due_date: row.cells[9].querySelector("input").value,
            // Desi-1
            designer1: row.cells[10].querySelector("select").value,
            designer1_target: parseInt(row.cells[11].querySelector("input").value) || 0,
            designer1_done: parseInt(row.cells[12].querySelector("input").value) || 0,
            // Desi-2
            designer2: row.cells[13].querySelector("select").value,
            designer2_target: parseInt(row.cells[14].querySelector("input").value) || 0,
            designer2_done: parseInt(row.cells[15].querySelector("input").value) || 0,
            // Desi-3
            designer3: row.cells[16].querySelector("select").value,
            designer3_target: parseInt(row.cells[17].querySelector("input").value) || 0,
            designer3_done: parseInt(row.cells[18].querySelector("input").value) || 0,
            // Desi-4
            designer4: row.cells[19].querySelector("select").value,
            designer4_target: parseInt(row.cells[20].querySelector("input").value) || 0,
            designer4_done: parseInt(row.cells[21].querySelector("input").value) || 0,
            done_today: parseInt(row.cells[22].querySelector("input").value) || 0,
            design_left: parseInt(row.cells[23].querySelector("input").value) || 0,
            total_done: parseInt(row.cells[24].querySelector("input").value) || 0
          });
        } else {
          // Sub row indices (no date cell)
          tasks.push({
            order_id: row.cells[0].querySelector("input").value.trim() || ("NEW-" + index),
            date: document.getElementById("dateCell").innerText.trim() ? new Date(document.getElementById("dateCell").innerText.trim()).toISOString().split("T")[0] : "",
            profile: row.cells[1].querySelector("select").value,
            client_name: row.cells[2].querySelector("input").value,
            total_needed: parseInt(row.cells[3].querySelector("input").value) || 0,
            previously_done: parseInt(row.cells[4].querySelector("input.progress-input").value) || 0,
            today_target: parseInt(row.cells[5].querySelector("input").value) || 0,
            project_status: row.cells[6].querySelector("select").value,
            remarks: row.cells[7].querySelector("input").value,
            due_date: row.cells[8].querySelector("input").value,
            // Desi-1
            designer1: row.cells[9].querySelector("select").value,
            designer1_target: parseInt(row.cells[10].querySelector("input").value) || 0,
            designer1_done: parseInt(row.cells[11].querySelector("input").value) || 0,
            // Desi-2
            designer2: row.cells[12].querySelector("select").value,
            designer2_target: parseInt(row.cells[13].querySelector("input").value) || 0,
            designer2_done: parseInt(row.cells[14].querySelector("input").value) || 0,
            // Desi-3
            designer3: row.cells[15].querySelector("select").value,
            designer3_target: parseInt(row.cells[16].querySelector("input").value) || 0,
            designer3_done: parseInt(row.cells[17].querySelector("input").value) || 0,
            // Desi-4
            designer4: row.cells[18].querySelector("select").value,
            designer4_target: parseInt(row.cells[19].querySelector("input").value) || 0,
            designer4_done: parseInt(row.cells[20].querySelector("input").value) || 0,
            done_today: parseInt(row.cells[21].querySelector("input").value) || 0,
            design_left: parseInt(row.cells[22].querySelector("input").value) || 0,
            total_done: parseInt(row.cells[23].querySelector("input").value) || 0
          });
        }
      });

      fetch('/tasks/update_tasks/', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(tasks)
      })
      .then(response => response.json())
      .then(data => {
        if(data.status === 'success'){
          alert("Update successful!");
        } else {
          alert("Update failed: " + data.message);
        }
      })
      .catch(error => {
        console.error("Error:", error);
        alert("An error occurred during update.");
      });
    }
  </script>
</body>
