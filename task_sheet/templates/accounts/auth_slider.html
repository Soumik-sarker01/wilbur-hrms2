<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login/Signup Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(to right, #f8f9fa, #e0e0e0);
    }

    .auth-container {
      width: 950px;
      height: 560px;
      margin: 60px auto;
      position: relative;
      overflow: hidden;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
      background: #fff;
    }

    .form-wrapper {
      display: flex;
      width: 100%;
      height: 100%;
      position: relative;
      transition: transform 0.6s ease;
    }

    .form-box {
      width: 50%;
      height: 100%;
      padding: 60px 40px;
      position: absolute;
      top: 0;
      transition: all 0.6s ease;
      background: white;
      z-index: 2;
    }

    .form-box h2 {
      text-align: center;
      margin-bottom: 30px;
      font-weight: 600;
      font-size: 28px;
    }

    input {
      display: block;
      width: 85%;
      margin: 12px auto;
      padding: 12px 15px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 14px;
      text-align: left;
    }

    .submit {
      display: block;
      width: 85%;
      height: 45px;
      margin: 30px auto;
      border-radius: 25px;
      background: #d4af7a;
      color: #fff;
      font-weight: 600;
      font-size: 15px;
      border: none;
      cursor: pointer;
      transition: background 0.3s;
    }

    .submit:hover {
      background: #c39a63;
    }

    .form-box.login {
      right: 0;
      transform: translateX(0%);
    }

    .form-box.signup {
      left: 0;
      transform: translateX(-100%);
    }

    .auth-container.s--signup .form-box.signup {
      transform: translateX(0%);
      z-index: 3;
    }

    .auth-container.s--signup .form-box.login {
      transform: translateX(100%);
    }

    .black-panel {
      position: absolute;
      width: 35%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.7);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 1;
      transition: all 0.6s ease;
      text-align: center;
      cursor: pointer;
    }

    .black-panel h4 {
      font-size: 20px;
      font-weight: 600;
    }

    .black-panel p {
      font-size: 14px;
    }

    .black-panel.left {
      left: 0;
      transform: translateX(0%);
    }

    .black-panel.right {
      right: 0;
      transform: translateX(100%);
    }

    .auth-container.s--signup .black-panel.left {
      transform: translateX(-100%);
    }

    .auth-container.s--signup .black-panel.right {
      transform: translateX(0%);
    }
  </style>
</head>
<body>
<div class="auth-container" id="authContainer">

  <!-- Left Text Panel (Show Signup Form) -->
  <div class="black-panel left" id="signupToggle">
    <div>
      <h4>Don't have an account?</h4>
      <p>Please sign up!</p>
    </div>
  </div>

  <!-- Right Text Panel (Show Login Form) -->
  <div class="black-panel right" id="loginToggle">
    <div>
      <h4>Do you have an account?</h4>
      <p>Please sign in!</p>
    </div>
  </div>

  <!-- Forms -->
  <div class="form-wrapper">
    <!-- Signup Form -->
    <form method="post" action="{% url 'signup' %}" class="form-box signup">
      {% csrf_token %}
      <h2>Signup</h2>
      <input type="text" name="username" placeholder="Username" required>
      <input type="password" name="password" placeholder="Password" required>
      <p class="text-muted text-center" style="font-size: 12px;">Your account will be created as Employee</p>
      <button type="submit" class="submit">Sign Up</button>
    </form>

    <!-- Login Form -->
    <form method="post" action="{% url 'login' %}" class="form-box login">
      {% csrf_token %}
      <h2>Login</h2>
      <input type="text" name="username" placeholder="Username" required>
      <input type="password" name="password" placeholder="Password" required>
      <button type="submit" class="submit">Sign In</button>
    </form>
  </div>
</div>

<script>
  const container = document.getElementById('authContainer');
  const signupToggle = document.getElementById('signupToggle');
  const loginToggle = document.getElementById('loginToggle');

  // Left panel shows SIGNUP form
  signupToggle.addEventListener('click', () => {
    container.classList.add('s--signup');
  });

  // Right panel shows LOGIN form
  loginToggle.addEventListener('click', () => {
    container.classList.remove('s--signup');
  });
</script>
</body>
</html>
